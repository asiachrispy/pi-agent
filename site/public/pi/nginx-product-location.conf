# 在 pi.gottao.com SSL server 块中、/app proxy 之前加入：

location = /robots.txt {
    root /var/www/pi-gottao;
    default_type text/plain;
    try_files /robots.txt =404;
}

location = /sitemap.xml {
    root /var/www/pi-gottao;
    default_type application/xml;
    try_files /sitemap.xml =404;
}

location = /product.html {
    root /var/www/pi;
    default_type text/html;
}

# 静态文件：/var/www/pi/product.html
# 线上根目录：/var/www/pi-gottao
# 根路径 / 保持产品介绍页，/app/ 为工作台且不进入 sitemap
